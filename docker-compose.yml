services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rivhit-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd123"
    ports:
      - "1433:1433"
    volumes:
      - rivhit_sqlserver_data:/var/opt/mssql

volumes:
  rivhit_sqlserver_data:

